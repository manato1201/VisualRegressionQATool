[project]
name = "capture-agents"
version = "0.1.0"
description = "Engine-agnostic CaptureAgent client for VisualRegressionQATool (Houdini reference implementation)"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["capture_agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
