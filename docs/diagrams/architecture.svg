le(1.000)"><rect x="5" y="6" width="30" height="12" rx="3"/><rect x="5" y="22" width="30" height="12" rx="3"/><circle class="fill" cx="11" cy="12" r="1.5"/><circle class="fill" cx="11" cy="28" r="1.5"/></g><rect class="card" x="608.0" y="383.0" width="64" height="64" rx="12"/><g class="ic" transform="translate(620.0 395.0) scale(1.000)"><circle cx="20" cy="20" r="15"/><path d="M12 20l6 6 11-12"/></g><rect class="card" x="868.0" y="383.0" width="64" height="64" rx="12"/><g class="ic" transform="translate(880.0 395.0) scale(1.000)"><ellipse cx="20" cy="9" rx="13" ry="4.5"/><path d="M7 9v22c0 2.5 5.8 4.5 13 4.5S33 33.500 33 31V9M7 20c0 2.5 5.8 4.500 13 4.500S33 22.500 33 20"/></g><rect class="card" x="1128.0" y="383.0" width="64" height="64" rx="12"/><g class="ic" transform="translate(1140.0 395.0) scale(1.000)"><path d="M4 10a3 3 0 0 1 3-3h8l4 5h14a3 3 0 0 1 3 3v15a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3z"/></g><rect class="card" x="1128.0" y="608.0" width="64" height="64" rx="12"/><g class="ic" transform="translate(1140.0 620.0) scale(1.000)"><path d="M11 31a7 7 0 0 1 0-14 9 9 0 0 1 17-2 7.500 7.500 0 0 1 1 16z"/></g><rect class="card" x="608.0" y="828.0" width="64" height="64" rx="12"/><g class="ic" transform="translate(620.0 840.0) scale(1.000)"><path d="M5 5h14l16 16-14 14L5 19z"/><circle class="fill" cx="12" cy="12" r="2"/></g><rect class="card" x="868.0" y="828.0" width="64" height="64" rx="12"/><g class="ic" transform="translate(880.0 840.0) scale(1.000)"><path d="M11 31a7 7 0 0 1 0-14 9 9 0 0 1 17-2 7.500 7.500 0 0 1 1 16z"/></g><rect class="card" x="1128.0" y="828.0" width="64" height="64" rx="12"/><g class="ic" transform="translate(1140.0 840.0) scale(1.000)"><rect x="4" y="7" width="32" height="26" rx="4"/><path d="M4 15h32"/><circle class="fill" cx="9" cy="11" r="1.2"/><circle class="fill" cx="13.5" cy="11" r="1.2"/></g><text class="title" x="150" y="242.0">Unity エージェント</text><text class="sub mono" x="150" y="261.0">unity_capture_agent</text><text class="sub mono" x="150" y="276.0">(C#・契約は共通)</text><text class="title" x="150" y="392.0">Houdini エージェント</text><text class="sub mono" x="150" y="411.0">capture_agents (Python)</text><text class="sub mono" x="150" y="426.0">view / comp</text><text class="title" x="150" y="542.0">CI スクリプト</text><text class="sub mono" x="150" y="561.0">ci_diff_check.py</text><text class="sub mono" x="150" y="576.0">fail で非ゼロ終了</text><text class="title" x="150" y="692.0">差分ビューア</text><text class="sub mono" x="150" y="711.0">React (index.html)</text><text class="sub mono" x="150" y="726.0">/admin.html は admin だけ</text><text class="title" x="640" y="242.0">入口の検査</text><text class="sub mono" x="640" y="261.0">Host・Origin・API キー</text><text class="sub mono" x="640" y="276.0">役割・監査ログ</text><text class="title" x="900" y="242.0">routers/</text><text class="sub mono" x="900" y="261.0">captures・references</text><text class="sub mono" x="900" y="276.0">diffs・runs・alerts</text><text class="title" x="640" y="467.0">diff_engine</text><text class="sub mono" x="640" y="486.0">PixelDiffEngine</text><text class="sub mono" x="640" y="501.0">3 つのつまみ</text><text class="title" x="900" y="467.0">repository + db</text><text class="sub mono" x="900" y="486.0">SQLite 5 テーブルの鎖</text><text class="sub mono" x="900" y="501.0">基準は有効 1 つ</text><text class="title" x="1160" y="467.0">storage</text><text class="sub mono" x="1160" y="486.0">BLOB(SHA-256 の名前)</text><text class="sub mono" x="1160" y="501.0">同じ中身は書かない</text><text class="title" x="1160" y="692.0">alert_sink</text><text class="sub mono" x="1160" y="711.0">IAlertSink</text><text class="sub mono" x="1160" y="726.0">fail で 1 回だけ開く</text><text class="title" x="640" y="912.0">GitHub Issue</text><text class="sub mono" x="640" y="931.0">ラベルで重複を防ぐ</text><text class="sub mono" x="640" y="946.0">復旧で自動クローズ</text><text class="title" x="900" y="912.0">Webhook</text><text class="sub mono" x="900" y="931.0">VRQA_WEBHOOK_URL</text><text class="title" x="1160" y="912.0">画面のトースト</text><text class="sub mono" x="1160" y="931.0">GET /api/alerts/toasts</text><rect class="lab" x="347.2" y="171.0" width="95.7" height="16" rx="3"/><text class="alabel mono blue" x="395.0" y="183.0">撮影画像を送る</text><rect class="lab" x="313.2" y="321.0" width="95.7" height="16" rx="3"/><text class="alabel mono blue" x="361.0" y="333.0">撮影画像を送る</text><rect class="lab" x="325.4" y="471.0" width="71.2" height="16" rx="3"/><text class="alabel mono blue" x="361.0" y="483.0">差分を実行</text><rect class="lab" x="307.0" y="621.0" width="107.9" height="16" rx="3"/><text class="alabel mono blue" x="361.0" y="633.0">閲覧・昇格・削除</text><rect class="lab" x="722.2" y="171.0" width="95.7" height="16" rx="3"/><text class="alabel mono blue" x="770.0" y="183.0">通ったものだけ</text><rect class="lab" x="934.4" y="309.0" width="71.2" height="16" rx="3"/><text class="alabel mono blue" x="970.0" y="321.0">保存・検索</text><rect class="lab" x="816.6" y="309.0" width="46.7" height="16" rx="3"/><text class="alabel mono blue" x="840.0" y="321.0">比べる</text><rect class="lab" x="1052.2" y="309.0" width="95.7" height="16" rx="3"/><text class="alabel mono blue" x="1100.0" y="321.0">画像の読み書き</text><rect class="lab" x="1209.5" y="404.0" width="81.1" height="16" rx="3"/><text class="alabel mono " x="1250.0" y="416.0">fail / pass</text><rect class="lab" x="1035.0" y="619.0" width="107.9" height="16" rx="3"/><text class="alabel mono " x="1089.0" y="631.0">通知先を差し替え</text><text class="hd" x="40" y="44" text-anchor="start">VisualRegressionQATool — 構成</text><text class="note" x="40" y="66" text-anchor="start">青=主な流れ / 灰の破線=補助。評価はピクセル比較だけ(類似度は使わない)。撮影の決定性は、撮る側の仕事</text><text class="note" x="500" y="722" text-anchor="start">撮影画像・基準・差分は、すべて同じ置き場。判定は pass / fail / flaky(同じ版で混在)</text></svg>
