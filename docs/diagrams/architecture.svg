<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 990" width="1400" role="img" aria-labelledby="t d"><title id="t">VisualRegressionQATool の構成</title><desc id="d">撮影エージェント(Unity・Houdini)・CI・ブラウザが、HTTP でバックエンドを呼ぶ。入口で Host・Origin・API キー・役割を検査し、ルーターが、画像を保存し、PixelDiffEngine で基準画像と比べ、結果を SQLite に残す。fail では通知先へ 1 回だけ知らせ、pass で閉じる。</desc><style>
:root{--bg:#ffffff;--grid:#edf0f4;--ink:#1d2433;--muted:#667085;--card:#ffffff;--cardline:#d0d5dd;--lab:#ffffff;
--blue:#1a73e8;--orange:#e8710a;--teal:#0f9d8a;--red:#d92d20;--gray:#667085;--purple:#7a5af8;
--f-blue:#f3f7fe;--f-orange:#fdf6ee;--f-teal:#f0f9f7;--f-red:#fef5f4;--f-gray:#f6f7f9;--f-purple:#f6f3ff}
@media (prefers-color-scheme: dark){:root{--bg:#14171d;--grid:#1f242d;--ink:#e6e9ef;--muted:#98a2b3;--card:#1b2029;--cardline:#3a4150;--lab:#14171d;
--blue:#6ea8fe;--orange:#f5a25d;--teal:#52c7b4;--red:#f97066;--gray:#98a2b3;--purple:#a99bff;
--f-blue:#17202e;--f-orange:#271f17;--f-teal:#152422;--f-red:#2a1b1a;--f-gray:#1a1e26;--f-purple:#1f1b2e}}
text{font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;fill:var(--ink)}
.mono{font-family:"JetBrains Mono","Cascadia Mono",Consolas,"Courier New",monospace}
.title{font-size:16px;font-weight:600;text-anchor:middle}
.sub{font-size:11.5px;text-anchor:middle;fill:var(--muted)}
.glabel{font-size:12.5px;font-weight:700;letter-spacing:.08em}
.alabel{font-size:12px;text-anchor:middle;fill:var(--muted)}
.alabel.blue{fill:var(--blue)} .alabel.orange{fill:var(--orange)} .alabel.red{fill:var(--red)}
.note{font-size:12px;fill:var(--muted)}
.hd{font-size:20px;font-weight:700}
.card{fill:var(--card);stroke:var(--cardline);stroke-width:1.2}
.ic{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.ic .fill{fill:var(--ink);stroke:none}
.lab{fill:var(--lab)}
.a{fill:none;stroke-width:2}
.a.primary{stroke:var(--blue)} .a.secondary{stroke:var(--gray);stroke-dasharray:6 5} .a.accent{stroke:var(--orange)} .a.danger{stroke:var(--red);stroke-dasharray:6 5}
.h.primary{fill:var(--blue)} .h.secondary{fill:var(--gray)} .h.accent{fill:var(--orange)} .h.danger{fill:var(--red)}
.badge{font-size:11px;font-weight:700;text-anchor:middle;fill:#fff}
</style><defs><pattern id="g" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="var(--grid)" stroke-width="1"/></pattern></defs><rect width="1400" height="990" fill="var(--bg)"/><rect width="1400" height="990" fill="url(#g)"/><rect x="40" y="100" width="250" height="640" rx="14" fill="var(--f-gray)" stroke="var(--gray)" stroke-width="1.5"/><rect x="62" y="90" width="118.6" height="20" fill="var(--bg)"/><text class="glabel mono" x="68" y="104.5" style="fill:var(--gray)">CLIENTS — 呼ぶ側</text><rect x="480" y="100" width="820" height="640" rx="14" fill="var(--f-teal)" stroke="var(--teal)" stroke-width="1.5"/><rect x="502" y="90" width="274.4" height="20" fill="var(--bg)"/><text class="glabel mono" x="508" y="104.5" style="fill:var(--teal)">BACKEND — FASTAPI (backend/app/)</text><rect x="480" y="790" width="820" height="170" rx="14" fill="var(--f-purple)" stroke="var(--purple)" stroke-width="1.5"/><rect x="502" y="780" width="200.6" height="20" fill="var(--bg)"/><text class="glabel mono" x="508" y="794.5" style="fill:var(--purple)">NOTIFY — 通知先(環境変数で差し替え)</text><path class="a primary" d="M182.0 190.0 L608.0 190.0"/><path class="h primary" d="M608.0 190.0 L597.0 184.5 L597.0 195.5 Z"/><path class="a primary" d="M182.0 340.0 L540.0 340.0 L540.0 190.0 L608.0 190.0"/><path class="h primary" d="M608.0 190.0 L597.0 184.5 L597.0 195.5 Z"/><path class="a primary" d="M182.0 490.0 L540.0 490.0 L540.0 190.0 L608.0 190.0"/><path class="h primary" d="M608.0 190.0 L597.0 184.5 L597.0 195.5 Z"/><path class="a primary" d="M182.0 640.0 L540.0 640.0 L540.0 190.0 L608.0 190.0"/><path class="h primary" d="M608.0 190.0 L597.0 184.5 L597.0 195.5 Z"/><path class="a primary" d="M672.0 190.0 L868.0 190.0"/><path class="h primary" d="M868.0 190.0 L857.0 184.5 L857.0 195.5 Z"/><path class="a primary" d="M932.0 190.0 L1040.0 190.0 L1040.0 330.0 L900.0 330.0 L900.0 383.0"/><path class="h primary" d="M900.0 383.0 L905.5 372.0 L894.5 372.0 Z"/><path class="a 